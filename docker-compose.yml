services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:8081:8081"

  web:
    build: ./apps/web
    depends_on: [api]
    ports:
      - "127.0.0.1:8080:8080"

  simulator:
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
    profiles: [tools]
    depends_on: [api]
    volumes:
      - ./examples:/data:ro
